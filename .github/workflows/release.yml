# Pushing a tag like v0.2.0 tests and builds a signed APK and attaches it to a DRAFT release.
# Publishing the draft (on GitHub) is what makes it the latest release the app offers as an update.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs with the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: >
          ./gradlew --no-daemon
          :shared:core:testAndroidHostTest :shared:ui:testAndroidHostTest :androidApp:assembleRelease
          -PappVersion="${GITHUB_REF_NAME#v}" -PreleasesRepo="$GITHUB_REPOSITORY"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="herald-${GITHUB_REF_NAME#v}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --draft --generate-notes --title "$GITHUB_REF_NAME"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
