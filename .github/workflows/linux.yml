# Separate from Android CI: keep this workflow's checks advisory in branch rules.
name: Linux (advisory)

# Only what the desktop app or its package is built from; an Android-only change skips the ~30 min run.
on:
  push:
    branches: [master]
    paths: &paths
      - "shared/**"
      - "desktopApp/**"
      - "packaging/flatpak/**"
      - "gradle/**"
      # Offline Gradle configures every project, the Android ones too.
      - "**/*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/linux.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

# A newer push to a PR replaces its run; every master commit keeps its own result. A group holds only one
# pending run even without cancel-in-progress, so master runs are grouped by commit.
concurrency:
  group: linux-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Flatpak build clones this checkout; a shallow one can't be cloned reliably.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: JVM tests
        run: >
          ./gradlew --no-daemon --max-workers=2
          :shared:core:jvmTest :shared:designsystem:jvmTest :shared:ui:jvmTest
          :shared:wearlink:jvmTest :desktopApp:jvmTest
      - name: Install Flatpak tools and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder fontconfig xvfb xauth xdotool python3-pil
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08
      - name: Packaging contracts
        run: |
          mkdir -p "$RUNNER_TEMP/fontconfig-sdk"
          cat > "$RUNNER_TEMP/fontconfig-sdk/fc-list" <<'SH'
          #!/bin/sh
          set -eu
          fixture="$(dirname "$(realpath "$FONTCONFIG_FILE")")"
          exec flatpak run --filesystem="$fixture" --filesystem="$GITHUB_WORKSPACE:ro" \
            --env="FONTCONFIG_FILE=$FONTCONFIG_FILE" --command=fc-list org.freedesktop.Sdk//26.08 "$@"
          SH
          chmod +x "$RUNNER_TEMP/fontconfig-sdk/fc-list"
          PATH="$RUNNER_TEMP/fontconfig-sdk:$PATH" python3 -m unittest discover -s packaging/flatpak/tests -v
      # From this checkout, not GitHub: a PR's merge ref moves whenever master does, which would fail the
      # builder's commit check mid-run. A clone carries only committed files, never untracked ones.
      - name: Select tested source
        run: |
          git update-ref refs/heads/flatpak-ci-tested "$GITHUB_SHA"
          python3 packaging/flatpak/prepare-ci.py \
            packaging/flatpak/io.github.Giton22.Kyllene.Devel.json \
            --repository "file://$GITHUB_WORKSPACE" \
            --ref flatpak-ci-tested --commit "$GITHUB_SHA"
      - name: Build offline and bundle
        run: |
          flatpak-builder --user --repo=build/flatpak-repo build/flatpak packaging/flatpak/ci.json
          flatpak build-bundle build/flatpak-repo build/kyllene.flatpak io.github.Giton22.Kyllene.Devel devel
      - name: Installed sandbox smoke
        run: python3 packaging/flatpak/tests/installed_smoke.py build/kyllene.flatpak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyllene-flatpak-x86_64
          path: build/kyllene.flatpak
          if-no-files-found: error
          retention-days: 14
