# Pushing a tag like v0.2.0 also builds the iOS app and uploads it to TestFlight, with the same version as the
# Android release (build number: the same 1.2.3 → 10203 scheme as Android's versionCode). Testers get it from
# TestFlight; App Store releases are submitted from App Store Connect by hand.
#
# Until these repo secrets exist, the job says so and stops without failing the release:
#   APPLE_TEAM_ID              the Apple Developer team id (10 characters)
#   ASC_KEY_ID, ASC_ISSUER_ID  a team App Store Connect API key (Users and Access → Integrations): Admin, or
#                              App Manager with access to Certificates, Identifiers & Profiles and to
#                              cloud-managed distribution certificates
#   ASC_KEY_P8_BASE64          that key's .p8 file, base64-encoded
# Xcode signs with the API key (automatic signing), so no certificates or profiles are kept in the repo.
# Once, by hand, beforehand: create the app's record in App Store Connect (bundle id dev.herald.ios) and register
# at least one device in the developer account, or automatic signing can't make the profiles.
#
# Pre-release tags (v1.2.3-rc1) skip the upload: their build number would be the final release's, which
# TestFlight then refuses. Xcode isn't pinned: the runner's default is a recent SDK, which App Store uploads need.
name: iOS release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Signing set up?
        id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set=0
          for value in "$TEAM" "$KEY_ID" "$ISSUER" "$KEY_P8"; do if [ -n "$value" ]; then set=$((set + 1)); fi; done
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "::notice::$GITHUB_REF_NAME is a pre-release: skipping the TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$set" -eq 4 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$set" -eq 0 ]; then
              echo "::notice::No App Store Connect secrets yet: skipping the TestFlight upload."
            else
              echo "::warning::Only $set of the 4 App Store Connect secrets are set: skipping the TestFlight upload."
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to commits, not tags, so a moved tag can't change what runs with the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.secrets.outputs.ready == 'true'

      - name: Kotlin/Native cache
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Version
        if: steps.secrets.outputs.ready == 'true'
        id: version
        run: |
          # Apple takes plain numbers only (pre-releases stopped above).
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]] || { echo "::error::$GITHUB_REF_NAME isn't a vMAJOR.MINOR.PATCH tag"; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          v="$major.$minor.$patch"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "build=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))" >> "$GITHUB_OUTPUT"

      - name: Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen && xcodegen --spec iosApp/project.yml

      - name: API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"

      - name: Archive and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc-key.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project iosApp/Herald.xcodeproj -scheme Herald -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Herald.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            "${auth[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Herald.xcarchive" \
            -exportOptionsPlist iosApp/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${auth[@]}"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
