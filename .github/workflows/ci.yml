# Tests and a debug build for every push and pull request.
# The only secret is GRADLE_ENCRYPTION_KEY (`openssl rand -base64 16`), which lets the configuration
# cache be saved between runs. Without it (forks, or before it's set) the build still works, just slower.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JetBrains Runtime, as everywhere else: Gradle's daemon asks for it (gradle/gradle-daemon-jvm.properties) and
      # the desktop installers ship it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "25"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Lint fails on any issue that isn't in androidApp/lint-baseline.xml. --continue reports the tests and
      # lint together instead of stopping at the first failure. assembleDev is built like a release (R8), so
      # a missing keep rule shows up here instead of as a crash on a phone.
      - name: Test, build and lint
        run: >
          ./gradlew --no-daemon --continue
          :shared:core:testAndroidHostTest :shared:designsystem:testAndroidHostTest :shared:ui:testAndroidHostTest :shared:wearlink:testAndroidHostTest
          :androidApp:assembleDebug :androidApp:assembleDev :androidApp:lintDebug :wearApp:testDebugUnitTest :wearApp:assembleDebug :wearApp:lintDebug

      # WebRTC's native code looks up org.jni_zero classes by name. If R8 renames them, live voice aborts in
      # JNI_OnLoad, and only in minified builds.
      - name: R8 kept WebRTC's JNI classes
        run: |
          apk=androidApp/build/outputs/apk/dev/androidApp-dev.apk
          [ -f "$apk" ] || { echo "::error::No dev APK at $apk"; exit 1; }
          count=$(unzip -p "$apk" 'classes*.dex' | { grep -a -o 'Lorg/jni_zero/[A-Za-z0-9_$/]*;' || true; } | sort -u | wc -l)
          echo "$apk keeps $count org.jni_zero classes"
          [ "$count" -gt 0 ] || { echo "::error::R8 renamed or removed org.jni_zero; check androidApp/proguard-rules.pro"; exit 1; }

      - name: R8 kept TeX macro reflection entry points
        run: |
          apk=androidApp/build/outputs/apk/dev/androidApp-dev.apk
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ -f "$apk" ] || { echo "::error::No dev APK at $apk"; exit 1; }
          [ -x "$analyzer" ] || { echo "::error::Android SDK apkanalyzer is unavailable"; exit 1; }
          smali=$(mktemp)
          trap 'rm -f "$smali"' EXIT
          "$analyzer" dex code --class org.scilab.forge.jlatexmath.NewCommandMacro "$apk" > "$smali"
          grep -Fxq '.class public Lorg/scilab/forge/jlatexmath/NewCommandMacro;' "$smali" || {
            echo '::error::R8 changed the TeX macro class name'; exit 1;
          }
          grep -Fxq '.method public constructor <init>()V' "$smali" || {
            echo '::error::R8 removed the public TeX macro constructor'; exit 1;
          }
          grep -Eq '^\.method public executeMacro\(L[^;]+;\[Ljava/lang/String;\)Ljava/lang/String;$' "$smali" || {
            echo '::error::R8 changed the TeX macro method'; exit 1;
          }

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: |
            androidApp/build/reports/lint-results-debug.html
            wearApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ios:
    # Kotlin/Native links and runs Apple targets only on macOS. macOS runners are free for public repos.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Kotlin/Native cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The shared tests on the iOS simulator, and the framework the iOS app links.
      - name: iOS tests and framework
        run: ./gradlew --no-daemon --continue :shared:core:iosSimulatorArm64Test :shared:designsystem:iosSimulatorArm64Test :shared:ui:iosSimulatorArm64Test :shared:ui:linkDebugFrameworkIosSimulatorArm64

      - name: iOS test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-report
          path: shared/*/build/reports/tests/
          if-no-files-found: ignore
