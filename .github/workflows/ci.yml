# Tests and a debug build for every push and pull request.
# The only secret is GRADLE_ENCRYPTION_KEY (`openssl rand -base64 16`), which lets the configuration
# cache be saved between runs. Without it (forks, or before it's set) the build still works, just slower.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Blacksmith's runners compile faster than GitHub's and have a free monthly allowance; bigger
    # machines use it up faster. Release stays on GitHub's runners because it holds the signing key.
    # To go back, set this to ubuntu-latest.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test and build
        run: ./gradlew --no-daemon :shared:core:testAndroidHostTest :shared:ui:testAndroidHostTest :androidApp:assembleDebug
