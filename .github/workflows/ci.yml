# Tests and a debug build for every push and pull request.
# The only secret is GRADLE_ENCRYPTION_KEY (`openssl rand -base64 16`), which lets the configuration
# cache be saved between runs. Without it (forks, or before it's set) the build still works, just slower.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to commits, not tags, so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Lint fails on any issue that isn't in androidApp/lint-baseline.xml. --continue reports the tests and
      # lint together instead of stopping at the first failure.
      - name: Test, build and lint
        run: ./gradlew --no-daemon --continue :shared:core:testAndroidHostTest :shared:designsystem:testAndroidHostTest :shared:ui:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ios:
    # Kotlin/Native links and runs Apple targets only on macOS. macOS runners are free for public repos.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Kotlin/Native cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The shared tests on the iOS simulator, and the framework the iOS app links.
      - name: iOS tests and framework
        run: ./gradlew --no-daemon --continue :shared:core:iosSimulatorArm64Test :shared:designsystem:iosSimulatorArm64Test :shared:ui:iosSimulatorArm64Test :shared:ui:linkDebugFrameworkIosSimulatorArm64

      - name: iOS test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-report
          path: shared/*/build/reports/tests/
          if-no-files-found: ignore

      # The app itself: XcodeGen writes the project, xcodebuild builds it (its pre-build phase runs Gradle for the
      # framework), and the simulator shows that it starts. The screenshot is kept with the run.
      - name: Xcode project
        run: brew install xcodegen && xcodegen --spec iosApp/project.yml

      - name: Build the app for the simulator
        run: >-
          xcodebuild -project iosApp/Herald.xcodeproj -scheme Herald -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/build
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: Launch in the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" iosApp/build/Build/Products/Debug-iphonesimulator/Herald.app
          # The app's own output, where Kotlin prints an uncaught exception before the crash.
          xcrun simctl launch --stdout="$PWD/ios-launch.log" --stderr="$PWD/ios-launch.log" "$udid" dev.herald.ios
          sleep 20
          xcrun simctl io "$udid" screenshot ios-launch.png
          # Still running after 20 s: it didn't crash on start.
          xcrun simctl spawn "$udid" launchctl list | grep -q "UIKitApplication:dev.herald.ios" || {
            echo "Herald isn't running"
            cat ios-launch.log || true
            exit 1
          }

      - name: Simulator screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screenshots
          path: |
            ios-launch.png
            ios-launch.log
          if-no-files-found: ignore

      - name: Crash reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
