# The Xcode project, as XcodeGen builds it: `brew install xcodegen`, then `xcodegen` in this folder writes
# Herald.xcodeproj (not checked in). The app is the shared Compose UI (shared/ui's HeraldShared framework,
# built by Gradle in the pre-build phase) in a small UIKit host.
name: Herald
options:
  bundleIdPrefix: dev.herald
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Bumped by the release workflow from the tag, like the Android versionName.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Herald:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Herald
      # The same Geist files the Android app ships, read by the shared design system.
      - path: ../shared/designsystem/src/androidMain/res/font
        buildPhase: resources
        includes:
          - "*.ttf"
    preBuildScripts:
      - name: Build the shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:ui:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herald.ios
        PRODUCT_NAME: Herald
        INFOPLIST_FILE: Herald/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework HeraldShared"
        # Gradle writes outside the sandbox Xcode gives build scripts.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
