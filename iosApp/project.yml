# The Xcode project, as XcodeGen builds it: `brew install xcodegen`, then `xcodegen` in this folder writes
# Herald.xcodeproj (not checked in). The app is the shared Compose UI (shared/ui's HeraldShared framework,
# built by Gradle in the pre-build phase) in a small UIKit host.
name: Herald
options:
  bundleIdPrefix: dev.herald
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The same WebRTC build as Android's webrtc-android (libs.versions.toml `webrtc`). Pinned by commit: the tag
  # 150.7871.01 isn't a version Swift Package Manager accepts.
  WebRTC:
    url: https://github.com/webrtc-sdk/Specs
    revision: 08bbe32d4b96b23a619369748239018d5358b940
settings:
  base:
    # Bumped by the release workflow from the tag, like the Android versionName.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Herald:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Herald
      # The same Geist files the Android app ships, read by the shared design system.
      - path: ../shared/designsystem/src/androidMain/res/font
        buildPhase: resources
        includes:
          - "*.ttf"
    preBuildScripts:
      - name: Build the shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:ui:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herald.ios
        PRODUCT_NAME: Herald
        INFOPLIST_FILE: Herald/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework HeraldShared"
        # Gradle writes outside the sandbox Xcode gives build scripts.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Herald/Herald.entitlements
    dependencies:
      - target: HeraldShare
      - package: WebRTC
  # The share sheet's "Herald": plain Swift, no shared framework (an extension has little memory).
  HeraldShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HeraldShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.herald.ios.share
        PRODUCT_NAME: HeraldShare
        INFOPLIST_FILE: HeraldShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeraldShare/HeraldShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
