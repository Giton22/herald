<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta charset="utf-8">
  <meta name="theme-color" content="#08090b">
  <title>Bot desktop</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5M20 7l-3-3"/></symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="13" rx="2"/><path d="M12 16v5M8 21h8"/></symbol>
    <symbol id="icon-hand" viewBox="0 0 24 24"><path d="M8 12V5a2 2 0 0 1 4 0v6-7a2 2 0 0 1 4 0v7-5a2 2 0 0 1 4 0v9c0 4-3 7-7 7h-1c-2 0-4-1-5-3l-4-5a2 2 0 0 1 3-3l2 2"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="m9 5-7 7 7 7M2 12h12a7 7 0 0 1 7 7"/></symbol>
    <symbol id="icon-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8v6H8z"/></symbol>
    <symbol id="icon-scroll" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="5"/><path d="M12 6v4"/></symbol>
    <symbol id="icon-paste" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 13h6m-3-3 3 3-3 3"/></symbol>
  </svg>
  <header>
    <button id="close" class="circle" aria-label="Close viewer" title="Disconnect viewer; keep the desktop running">
      <svg><use href="#icon-close"/></svg>
    </button>
    <div class="identity">
      <div class="computer-title"><svg><use href="#icon-monitor"/></svg><span>Bot desktop</span></div>
      <span id="state" role="status" aria-live="polite">Connecting…</span>
    </div>
    <button id="refresh" class="circle" aria-label="Refresh viewer" title="Refresh and hand control back">
      <svg><use href="#icon-refresh"/></svg>
    </button>
  </header>
  <main aria-label="Remote desktop">
    <div id="viewport"><div id="screen"><div id="placeholder">Opening the desktop…</div></div></div>
    <button id="connect" hidden>Retry connection</button>
  </main>
  <p id="notice" role="status" aria-live="polite"></p>
  <p id="copy-explanation" role="status" aria-live="polite" hidden>Copy from the desktop is unavailable in sandbox sessions. Paste remains available when you have control.</p>
  <footer>
    <div class="control-pill" aria-label="Control handoff">
      <button id="take" disabled aria-label="Take control" title="Take control"><svg><use href="#icon-hand"/></svg><span>Take control</span></button>
      <button id="back" hidden disabled aria-label="Hand back" title="Hand back"><svg><use href="#icon-back"/></svg><span>Hand back</span></button>
    </div>
    <div class="scaling"><button id="fit" hidden>Fit</button><button id="zoom" hidden>100%</button></div>
    <div class="tools-pill" role="group" aria-label="Viewer controls">
      <button id="viewer-fit" title="Toggle fit and local zoom" aria-label="Toggle fit and local zoom" aria-pressed="false"><svg><use href="#icon-fit"/></svg></button>
      <button id="scroll-mode" title="Scroll lock off" aria-label="Scroll lock" aria-pressed="false" disabled><svg><use href="#icon-scroll"/></svg></button>
      <button id="keyboard" disabled aria-label="Show phone keyboard" title="Show phone keyboard" aria-pressed="false"><svg><use href="#icon-keyboard"/></svg></button>
      <button id="copy" disabled aria-describedby="copy-explanation" aria-label="Copy selected desktop text to phone" title="Copy selected desktop text to phone"><svg><use href="#icon-copy"/></svg></button>
      <button id="paste" disabled aria-label="Paste phone clipboard into focused app" title="Paste phone clipboard into focused app"><svg><use href="#icon-paste"/></svg></button>
    </div>
  </footer>
  <textarea id="keyboard-input" class="keyboard-input" aria-label="Remote keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" disabled></textarea>
  <script type="module" src="./app.js"></script>
</body>
</html>
